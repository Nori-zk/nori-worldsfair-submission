[package]
name = "backstop"
version = "0.1.0"
description = "Circuit breakers for bridged assets: proven Ethereum backing vs Solana supply"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "backstop"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "nori-read/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
alloy-primitives = "1.7.1"
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
nori-read = { path = "../../nori-read" }

[dev-dependencies]
bytemuck = "1"
nori-read = { path = "../../nori-read", features = ["test-vectors"] }
test-harness = { path = "../../test-harness" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
