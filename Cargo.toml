[workspace]
members = [
    "nori-read",
    "programs/*",
    "test-harness",
]
# The sdk's crates (token, test-utils) are git dependencies pinned to one commit,
# the one its npm 0.0.5 was published from. Bump the rev and the npm versions together.
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
